/* =====================================================
   GLOBAL / MOBILE SAFETY
===================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 12px;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  overflow-x: hidden;
}

#pageRoot {
  position: relative;
  width: 100%;
  max-width: 800px;
  min-height: calc(100vh - 24px);
  margin: 0 auto;
  padding: 18px;
  border-radius: 10px;
  overflow: hidden;
}

/* =====================================================
   CONTENT
===================================================== */

#contentLayer {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 100%;
}

/* =====================================================
   IMAGES
===================================================== */

img {
  max-width: 100%;
}

.brand-avatar {
  display: block;
  width: 90px;
  max-width: 90px;
  height: 90px;
  object-fit: cover;
  margin: 0 auto 10px;
  border-radius: 50%;
}

.brand-logo {
  display: block;
  width: 140px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  margin: 10px auto;
}

.brand-banner {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  margin: 12px 0;
  border-radius: 8px;
}

.safe-image {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

/* =====================================================
   GALLERY
===================================================== */

.gallery {
  width: 100%;
  max-width: 100%;
  margin: 14px 0;
  display: block;
}

.gallery.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

.gallery.large-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.gallery-card {
  width: 100%;
  max-width: 100%;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 8px;
  background: #fff;
  overflow: hidden;
}

.gallery-card img {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 6px;
}

.gallery-card p {
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* =====================================================
   TEXT
===================================================== */

h1,
h2,
h3,
p,
label,
small,
strong {
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* =====================================================
   FORM
===================================================== */

.form-container {
  width: 100%;
  max-width: 100%;
  margin-top: 16px;
}

.form-container form {
  width: 100%;
  max-width: 100%;
  padding: 0;
  margin: 16px 0;
  background: transparent;
  border: none;
  box-shadow: none;
}

.form-container input,
.form-container textarea,
.form-container select,
.form-container button {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  padding: 10px;
  margin-top: 7px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font: inherit;
}

.form-container textarea {
  min-height: 80px;
  resize: vertical;
}

.form-container button {

}

/* =====================================================
   EMBEDS
===================================================== */

.embedLink {
  width: 100%;
  max-width: 100%;
  margin-top: 8px;
  padding: 8px;
  background: #e8f0fe;
  border-radius: 6px;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.embedLink a {
  overflow-wrap: anywhere;

}

.videoFrame {
  display: block;

  max-width: 100%;
  height: 220px;
  border: 0;
  border-radius: 8px;
  margin: 12px 0;
}

/* =====================================================
   WARNING
===================================================== */

.warning-box {
  width: 100%;
  max-width: 100%;
  margin: 12px 0;
  padding: 10px;

  word-break: break-word;

/* =====================================================
   ADS
===================================================== */

.ad-box {
  width: 100%;
  max-width: 100%;
  margin: 12px 0;
  padding: 10px;
  background: #fff3cd;
  border-radius: 6px;
  overflow-wrap: anywhere;
}

/* =====================================================
   EXTRA BUTTONS
===================================================== */

.draggableBtn {
  position: absolute;
  z-index: 5;
  cursor: pointer;
  color: #fff;

/* =====================================================
   BACKGROUND VIDEO
===================================================== */

.bg-video {

  inset: 0;

  width: 100%;

.bg-overlay {

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyB5zWUvl64s6wAjjeXd0mCUyhMEdzg_MmM",

};

  firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* =====================================================
   QUERY PARAMETER
===================================================== */

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

const formId = getQueryParam("id");

/* =====================================================
   HELPERS
===================================================== */

function clean(value, fallback = "") {
  if (value === undefined || value === null) {
    return fallback;
  }

  return String(value);
}

function safeUrl(value) {
  if (!value) return "";

  try {
    const url = new URL(value, window.location.href);

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {
      return url.href;
    }

    return "";
  } catch (e) {
    return "";
  }
}

function imageUrl(item) {

  if (typeof item === "string") {
    return safeUrl(item);
  }

  if (!item || typeof item !== "object") {
    return "";
  }

  return safeUrl(
    item.img ||
    item.url ||
    item.image ||
    item.imageURL ||
    ""
  );
}

function applyImageSafety(img) {

  img.loading = "lazy";
  img.decoding = "async";

  img.style.display = "block";
  img.style.maxWidth = "100%";
  img.style.height = "auto";

  img.onerror = function() {
    this.style.display = "none";
  };
}

/* =====================================================
   NORMALIZE DATA
   Matches form_builder.html structure
===================================================== */

function normalizeData(data) {

  data = data || {};

  /* SEO */

  if (data.seo) {

    data.seoTitle =
      data.seo.title ||
      data.seoTitle ||
      "";

    data.metaDesc =
      data.seo.description ||
      data.metaDesc ||
      "";

    data.ogImage =
      data.seo.ogImage ||
      data.ogImage ||
      "";
  }

  /* Branding */

  if (data.branding) {

    data.avatarURL =
      data.branding.avatar ||
      data.avatarURL ||
      "";

    data.logoURL =
      data.branding.logo ||
      data.logoURL ||
      "";

    data.bannerURL =
      data.branding.banner ||
      data.bannerURL ||
      "";
  }

  /* Page */

  if (data.page) {

    data.title =
      data.page.title ||
      data.title ||
      data.pageTitle ||
      "";

    data.pageTitle =
      data.page.title ||
      data.pageTitle ||
      data.title ||
      "";

    data.subtitle =
      data.page.subtitle ||
      data.subtitle ||
      "";

    data.description =
      data.page.description ||
      data.description ||
      "";

    data.footerText =
      data.page.footer ||
      data.footerText ||
      "";
  }

  /* Styling */

  if (data.styling) {

    data.textColor =
      data.styling.textColor ||
      data.textColor ||
      "#222";

    data.bgColor =
      data.styling.bgColor ||
      data.bgColor ||
      "#fff";

    data.bgImage =
      data.styling.bgImage ||
      data.bgImage ||
      "";

    data.bgVideoURL =
      data.styling.bgVideo ||
      data.bgVideoURL ||
      "";

    data.btnColor =
      data.styling.buttonColor ||
      data.btnColor ||
      "#1976d2";

    data.btnPosition =
      data.styling.buttonPosition ||
      data.btnPosition ||
      "center";
  }

  /* Gallery */

  data.galleryItems =
    Array.isArray(data.galleryItems)
      ? data.galleryItems
      : [];

  /* Videos */

  data.videoLinks =
    data.videoLinks ||
    "";

  /* Embeds */

  data.embedLinks =
    Array.isArray(data.embedLinks)
      ? data.embedLinks
      : Array.isArray(data.embeds)
        ? data.embeds
        : [];

  /* Extra buttons */

  data.extraButtons =
    Array.isArray(data.extraButtons)
      ? data.extraButtons
      : [];

  /* Fields */

  data.fields =
    Array.isArray(data.fields)
      ? data.fields
      : [];

  /* Warning */

  if (
    data.warning &&
    typeof data.warning === "object"
  ) {

    data.enableWarning = true;

    data.warningPosition =
      data.warning.position ||
      "center";

    data.warning =
      data.warning.text ||
      "";
  }

  return data;
}

/* =====================================================
   SEO
===================================================== */

function updateSEO(data) {

  const title =
    clean(
      data.seoTitle ||
      data.title ||
      data.pageTitle,
      "Untitled Form"
    );

  const description =
    clean(data.metaDesc || "");

  const ogImage =
    safeUrl(data.ogImage || "");

  document.title = title;

  const descriptionTag =
    document.querySelector(
      'meta[name="description"]'
    );

  if (descriptionTag) {
    descriptionTag.setAttribute(
      "content",
      description
    );
  }

  const ogTitle =
    document.querySelector(
      'meta[property="og:title"]'
    );

  if (ogTitle) {
    ogTitle.setAttribute(
      "content",
      title
    );
  }

  const ogDescription =
    document.querySelector(
      'meta[property="og:description"]'
    );

  if (ogDescription) {
    ogDescription.setAttribute(
      "content",
      description
    );
  }

  const ogImageTag =
    document.querySelector(
      'meta[property="og:image"]'
    );

  if (ogImageTag) {
    ogImageTag.setAttribute(
      "content",
      ogImage
    );
  }

  const twitterTitle =
    document.querySelector(
      'meta[name="twitter:title"]'
    );

  if (twitterTitle) {
    twitterTitle.setAttribute(
      "content",
      title
    );
  }

  const twitterDescription =
    document.querySelector(
      'meta[name="twitter:description"]'
    );

  if (twitterDescription) {
    twitterDescription.setAttribute(
      "content",
      description
    );
  }

  const twitterImage =
    document.querySelector(
      'meta[name="twitter:image"]'
    );

  if (twitterImage) {
    twitterImage.setAttribute(
      "content",
      ogImage
    );
  }
}

/* =====================================================
   BACKGROUND
===================================================== */

function renderBackground(data, root) {

  root.style.backgroundColor =
    data.bgColor || "#fff";

  const bgImage =
    safeUrl(data.bgImage || "");

  if (bgImage) {

    root.style.backgroundImage =
      `url("${bgImage}")`;

    root.style.backgroundSize =
      data.bgSize || "cover";

    root.style.backgroundRepeat =
      "no-repeat";

    root.style.backgroundPosition =
      "center";
  }

  /* Background video */

  const videoURL =
    safeUrl(data.bgVideoURL || "");

  if (videoURL) {

    const video =
      document.createElement("video");

    video.className = "bg-video";

    video.src = videoURL;

    video.autoplay = true;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.preload = "auto";

    root.appendChild(video);

    const overlay =
      document.createElement("div");

    overlay.className =
      "bg-overlay";

    root.appendChild(overlay);
  }
}

/* =====================================================
   BRANDING
===================================================== */

function renderBranding(data, container) {

  /* Avatar */

  const avatarURL =
    safeUrl(data.avatarURL || "");

  if (avatarURL) {

    const img =
      document.createElement("img");

    img.src = avatarURL;
    img.className = "brand-avatar";

    applyImageSafety(img);

    container.appendChild(img);
  }

  /* Logo */

  const logoURL =
    safeUrl(data.logoURL || "");

  if (logoURL) {

    const img =
      document.createElement("img");

    img.src = logoURL;
    img.className = "brand-logo";

    applyImageSafety(img);

    container.appendChild(img);
  }

  /* Banner */

  const bannerURL =
    safeUrl(data.bannerURL || "");

  if (bannerURL) {

    const img =
      document.createElement("img");

    img.src = bannerURL;
    img.className = "brand-banner";

    applyImageSafety(img);

    container.appendChild(img);
  }
}

/* =====================================================
   TITLE / SUBTITLE / DESCRIPTION
===================================================== */

function renderPageText(data, container) {

  const title =
    clean(
      data.title ||
      data.pageTitle ||
      "Untitled Form"
    );

  const titleEl =
    document.createElement("h2");

  titleEl.textContent = title;

  titleEl.style.textAlign =
    data.titlePosition || "center";

  titleEl.style.color =
    data.titleColor || "#111";

  if (data.titleSize) {

    titleEl.style.fontSize =
      clean(data.titleSize) + "px";
  }

  container.appendChild(titleEl);

  /* Subtitle */

  const subtitle =
    document.createElement("p");

  subtitle.textContent =
    clean(data.subtitle);

  subtitle.style.textAlign =
    "center";

  subtitle.style.color =
    data.subtitleColor || "#555";

  container.appendChild(subtitle);

  /* Description */

  if (data.description) {

    const desc =
      document.createElement("p");

    desc.textContent =
      clean(data.description);

    container.appendChild(desc);
  }
}

/* =====================================================
   GALLERY
   Matches galleryItems saved by form_builder.html
===================================================== */

function renderGallery(data, container) {

  if (
    !Array.isArray(data.galleryItems) ||
    data.galleryItems.length === 0
  ) {
    return;
  }

  const gallery =
    document.createElement("div");

  gallery.className = "gallery";

  const layout =
    data.galleryItemsLayout ||
    data.galleryLayout ||
    "list";

  if (layout === "grid") {
    gallery.classList.add("grid");
  }

  if (layout === "large-grid") {
    gallery.classList.add("large-grid");
  }

  data.galleryItems.forEach(item => {

    const src =
      imageUrl(item);

    if (!src) return;

    const card =
      document.createElement("div");

    card.className =
      "gallery-card";

    const img =
      document.createElement("img");

    img.src = src;

    applyImageSafety(img);

    card.appendChild(img);

    /* Gallery description */

    if (
      item &&
      typeof item === "object" &&
      item.desc
    ) {

      const p =
        document.createElement("p");

      p.textContent =
        item.desc;

      card.appendChild(p);
    }

    /* Gallery masked link */

    if (
      item &&
      typeof item === "object" &&
      item.link &&
      item.mask
    ) {

      const linkURL =
        safeUrl(item.link);

      if (linkURL) {

        const a =
          document.createElement("a");

        a.href = linkURL;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        a.textContent =
          item.mask;

        card.appendChild(a);
      }
    }

    gallery.appendChild(card);
  });

  container.appendChild(gallery);
}

/* =====================================================
   VIDEOS
===================================================== */

function renderVideos(data, container) {

  if (!data.videoLinks) {
    return;
  }

  const links =
    String(data.videoLinks)
      .split("\n")
      .map(v => v.trim())
      .filter(Boolean);

  links.forEach(link => {

    const url =
      safeUrl(link);

    if (!url) return;

    const iframe =
      document.createElement("iframe");

    iframe.className =
      "videoFrame";

    iframe.src = url;

    iframe.loading = "lazy";

    iframe.allowFullscreen = true;

    iframe.setAttribute(
      "allowfullscreen",
      ""
    );

    iframe.setAttribute(
      "referrerpolicy",
      "strict-origin-when-cross-origin"
    );

    container.appendChild(iframe);
  });
}

/* =====================================================
   WARNING
===================================================== */

function renderWarning(data, container) {

  if (!data.enableWarning) {
    return;
  }

  if (
    !data.warning ||
    data.warningPosition === "none"
  ) {
    return;
  }

  const warning =
    document.createElement("div");

  warning.className =
    "warning-box";

  warning.textContent =
    clean(data.warning);

  warning.style.color =
    data.warningColor ||
    "#b71c1c";

  warning.style.textAlign =
    data.warningPosition ||
    "center";

  container.appendChild(warning);
}

        "Submission error:",
        error
      );

      if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent =
          data.buttonText || "Submit";
      }

      alert(
        "Unable to submit the form. Please try again."
      );
    }
  });

  /* =========================
     RENDER FIELDS
  ========================= */

  if (
    Array.isArray(data.fields) &&
    data.fields.length
  ) {

    data.fields.forEach((field, index) => {

      if (!field) return;

      const type =
        field.type || "text";

      const wrapper =
        document.createElement("div");

      wrapper.style.width = "100%";

      const label =
        document.createElement("label");

      label.textContent =
        field.placeholder ||
        field.label ||
        `Field ${index + 1}`;

      label.style.display = "block";
      label.style.marginBottom = "5px";
      label.style.fontWeight = "600";

      let input;

      if (type === "textarea") {

        input =
          document.createElement("textarea");

      } else {

        input =
          document.createElement("input");

        input.type =
          type || "text";
      }

      /*
       * Important:
       * Every field now has a name.
       */
      input.name =
        field.name ||
        field.placeholder ||
        `field_${index + 1}`;

      input.placeholder =
        field.placeholder || "";

      if (type === "password") {
  input.autocomplete = "current-password";
} else {
  input.autocomplete = "off";
}

      applyInputStyle(
        input,
        data
      );

      wrapper.appendChild(label);
      wrapper.appendChild(input);

      form.appendChild(wrapper);
    });
  }

  /* =========================
     EXTRA FIELDS
  ========================= */

  if (
    Array.isArray(data.extraFields)
  ) {

    data.extraFields.forEach(
      (field, index) => {

        if (!field) return;

        const wrapper =
          document.createElement("div");

        const label =
          document.createElement("label");

        label.textContent =
          String(field);

        label.style.display = "block";
        label.style.marginBottom = "5px";
        label.style.fontWeight = "600";

        const input =
          document.createElement("input");

        input.type = "text";

        input.name =
          String(field)
            .trim()
            .replace(/\s+/g, "_")
            .toLowerCase();

        input.placeholder =
          String(field);

        applyInputStyle(
          input,
          data
        );

        wrapper.appendChild(label);
        wrapper.appendChild(input);

        form.appendChild(wrapper);
      }
    );
  }

  /* =========================
     SUBMIT BUTTON
  ========================= */

  if (data.showMainBtn !== false) {

    const button =
      document.createElement("button");

    button.type = "submit";

    button.textContent =
      data.buttonText ||
      "Submit";

    button.style.background =
      data.btnColor ||
      "#1976d2";

    button.style.color = "#fff";
    button.style.border = "none";
    button.style.padding = "12px 18px";
    button.style.borderRadius = "8px";
    button.style.cursor = "pointer";
    button.style.fontSize = "16px";
    button.style.marginTop = "5px";

    if (
      data.btnPosition === "left"
    ) {
      button.style.alignSelf =
        "flex-start";
    }

    else if (
      data.btnPosition === "right"
    ) {
      button.style.alignSelf =
        "flex-end";
    }

    else {
      button.style.alignSelf =
        "center";
    }

    form.appendChild(button);
  }

  container.appendChild(form);
}

/* =====================================================
   INPUT STYLING
===================================================== */

function applyInputStyle(input, data) {

  input.style.background =
    data.inputBgColor ||
    "#fff";

  input.style.color =
    data.inputTextColor ||
    "#000";

  input.style.border =
    `1px solid ${
      data.inputBorderColor ||
      "#ccc"
    }`;

  input.style.borderRadius =
    data.customRadius
      ? data.customRadius + "px"
      : "6px";
}

/* =====================================================
   EMBED LINKS
===================================================== */

function renderEmbeds(data, container) {

  if (
    !Array.isArray(data.embedLinks)
  ) {
    return;
  }

  data.embedLinks.forEach(link => {

    if (!link || link.show === false) {
      return;
    }

    const div =
      document.createElement("div");

    div.className =
      "embedLink";

    if (link.text) {

      const strong =
        document.createElement("strong");

      strong.textContent =
        link.text;

      div.appendChild(strong);
      div.appendChild(
        document.createElement("br")
      );
    }

    const url =
      safeUrl(link.url);

    if (url) {

      const a =
        document.createElement("a");

      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      a.textContent =
        link.url;

      div.appendChild(a);
    }

    if (link.desc) {

      const small =
        document.createElement("small");

      small.textContent =
        link.desc;

      div.appendChild(
        document.createElement("br")
      );

      div.appendChild(small);
    }

    container.appendChild(div);
  });
}

/* =====================================================
   ADS
===================================================== */

function renderAds(data, container) {

  if (!data.enableAds) {
    return;
  }

  const ad =
    document.createElement("div");

  ad.className =
    "ad-box";

  const strong =
    document.createElement("strong");

  strong.textContent =
    "Sponsored";

  const text =
    document.createElement("div");

  text.textContent =
    data.adText || "";

  ad.appendChild(strong);
  ad.appendChild(
    document.createElement("br")
  );
  ad.appendChild(text);

  container.appendChild(ad);
}

/* =====================================================
   EXTRA BUTTONS
===================================================== */

function renderExtraButtons(data, root) {

  if (
    !Array.isArray(data.extraButtons)
  ) {
    return;
  }

  data.extraButtons.forEach(buttonData => {

    if (
      !buttonData ||
      buttonData.show === false
    ) {
      return;
    }

    const button =
      document.createElement("button");

    button.className =
      "draggableBtn";

    button.type =
      "button";

    button.textContent =
      buttonData.text ||
      "Button";

    button.style.background =
      buttonData.color ||
      "#1976d2";

    const size =
      Number(buttonData.size);

    if (size > 0) {

      button.style.width =
        size + "px";

      button.style.height =
        size + "px";
    }

    if (
      buttonData.x !== undefined
    ) {

      button.style.left =
        Number(buttonData.x) + "%";
    }

    if (
      buttonData.y !== undefined
    ) {

      button.style.top =
        Number(buttonData.y) + "%";
    }

    button.addEventListener(
      "click",
      function() {

        const url =
          safeUrl(buttonData.link);

        if (url) {

          window.open(
            url,
            "_blank",
            "noopener,noreferrer"
          );
        }
      }
    );

    root.appendChild(button);
  });
}

/* =====================================================
   FOOTER
===================================================== */

function renderFooter(data, container) {

  if (!data.footerText) {
    return;
  }

  const footer =
    document.createElement("footer");

  footer.className =
    "page-footer";

  footer.textContent =
    data.footerText;

  container.appendChild(footer);
}

/* =====================================================
   MAIN RENDERER
===================================================== */

function renderForm(rawData) {

  const data =
    normalizeData(rawData);

  const root =
    document.getElementById(
      "pageRoot"
    );

  const content =
    document.getElementById(
      "contentLayer"
    );

  content.innerHTML = "";

  root.style.color =
    data.textColor ||
    "#222";

  renderBackground(
    data,
    root
  );

  renderBranding(
    data,
    content
  );

  renderPageText(
    data,
    content
  );

  renderGallery(
    data,
    content
  );

  renderVideos(
    data,
    content
  );

  renderWarning(
    data,
    content
  );

  const formContainer =
    document.createElement("div");

  formContainer.className =
    "form-container";

  content.appendChild(
    formContainer
  );

  renderFields(
    data,
    formContainer
  );

  renderEmbeds(
    data,
    formContainer
  );

  renderAds(
    data,
    content
  );

  renderFooter(
    data,
    content
  );

  renderExtraButtons(
    data,
    root
  );
}

/* =====================================================
   LOAD FORM FROM FIRESTORE
===================================================== */

async function loadForm() {

  const loading =
    document.getElementById(
      "loading"
    );

  if (!formId) {

    loading.textContent =
      "No form ID provided.";

    return;
  }

  try {

    const doc =
      await db
        .collection("forms")
        .doc(formId)
        .get();

    if (!doc.exists) {

      loading.textContent =
        "Form not found.";

      return;
    }

    const data =
      doc.data();

    console.log(
      "FORM DATA:",
      data
    );

    updateSEO(data);

    renderForm(data);

  } catch (error) {

    console.error(
      "Error loading form:",
      error
    );

    loading.textContent =
      "Error loading form.";
  }
}

/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  loadForm
);

</script>

</body>
